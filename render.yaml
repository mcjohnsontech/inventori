services:
  - type: web
    name: dayari-inventory-staging-api
    runtime: node
    plan: free
    branch: staging
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DAYARI_DEPLOYMENT
        value: staging
      - key: AUTHORITY_MODE
        value: SHOP
      - key: SHOP_NODE_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dayari-inventory-staging-db
          property: connectionString
      - key: APP_PUBLIC_URL
        value: https://dayari-inventory-staging.vercel.app
      - key: INVITATION_TRANSPORT
        value: disabled
      - key: INVITATION_LIVE_ENABLED
        value: '0'
      - key: INVITATION_WORKER
        value: '0'

# Temporary staging only. Free Render PostgreSQL expires after 30 days.
# Never apply this Blueprint to production or import operational stock into it.
databases:
  - name: dayari-inventory-staging-db
    plan: free
    postgresMajorVersion: '17'
