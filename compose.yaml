name: dayari-development
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayari_dev
      POSTGRES_USER: dayari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dayari_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayari -d dayari_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dayari_dev_pg:
